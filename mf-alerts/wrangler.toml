# Daily mutual fund drawdown check. Deploy from this directory:
#   npx wrangler deploy
# Settings kept out of this public repo (once each):
#   npx wrangler secret put GMAIL_USER          # the Gmail address alerts are sent from
#   npx wrangler secret put GMAIL_APP_PASSWORD  # 16-character Gmail app password
#   npx wrangler secret put MASTER_EMAIL        # the account that grants access
name = "mf-alerts"
main = "worker.js"
compatibility_date = "2025-09-01"
# Not reachable over HTTP: it only runs on the schedule below.
workers_dev = false

[triggers]
# 03:30 UTC = 09:00 IST, after AMFI has published the previous day's NAVs.
crons = ["30 3 * * *"]

[[kv_namespaces]]
binding = "MF_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
SITE_URL = "https://www.iamabhilash.in"

[observability]
enabled = true
