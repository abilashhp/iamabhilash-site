# Daily mutual fund drawdown check. Deploy from this directory:
#   npx wrangler deploy
# Secrets (once), kept out of this public repo:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put ALLOWED_EMAILS   # comma-separated; mail only ever goes to these
name = "mf-alerts"
main = "worker.js"
compatibility_date = "2025-09-01"
# Not reachable over HTTP: it only runs on the schedule below.
workers_dev = false

[triggers]
# 03:30 UTC = 09:00 IST, after AMFI has published the previous day's NAVs.
crons = ["30 3 * * *"]

[[kv_namespaces]]
binding = "MF_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
MAIL_FROM = "MF Alerts <alerts@iamabhilash.in>"
SITE_URL = "https://www.iamabhilash.in"

[observability]
enabled = true
